name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.14"
          python-version: "3.12"
      - name: Install test dependencies (no embedding weights)
        run: uv sync --frozen --extra jev
      - name: Lint
        run: uv run --frozen --extra jev ruff check src tests
      - name: Check formatting
        run: uv run --frozen --extra jev ruff format --check src tests
      - name: Test with fixture providers
        run: uv run --frozen --extra jev pytest -q
      - name: Build distributions
        run: uv build
