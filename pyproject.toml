[project]
name = "filing-delta-radar"
version = "0.1.0"
description = "Local, auditable semantic disclosure comparisons for SEC filings"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "jinja2>=3.1",
  "lxml>=5",
  "numpy>=1.26",
  "pydantic>=2.9",
  "python-dotenv>=1",
  "rapidfuzz>=3.9",
  "scipy>=1.12",
  "rich>=13",
  "typer>=0.12",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3", "torch>=2.4"]
jev = ["typesafe-sdk>=0.1"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
radar = "radar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live_jev: opt-in paid TypeSafe integration"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# CPU wheels keep a local research install from pulling CUDA runtimes.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
